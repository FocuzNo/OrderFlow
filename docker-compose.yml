name: orderflow

services:
  catalog-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
      POSTGRES_DB: catalog
    ports: ["5433:5432"]
    volumes: [catalog-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/OrderFlow.Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDatabase: Host=catalog-postgres;Database=catalog;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}
    ports: ["5001:8080"]
    depends_on:
      catalog-postgres:
        condition: service_healthy

  inventory-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
      POSTGRES_DB: inventory
    ports: ["5434:5432"]
    volumes: [inventory-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-api:
    build:
      context: .
      dockerfile: src/Services/Inventory/OrderFlow.Inventory.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDatabase: Host=inventory-postgres;Database=inventory;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}
    ports: ["5002:8080"]
    depends_on:
      inventory-postgres:
        condition: service_healthy

  ordering-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
      POSTGRES_DB: ordering
    ports: ["5435:5432"]
    volumes: [ordering-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d ordering"]
      interval: 5s
      timeout: 3s
      retries: 20

  ordering-api:
    build:
      context: .
      dockerfile: src/Services/Ordering/OrderFlow.Ordering.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrderingDatabase: Host=ordering-postgres;Database=ordering;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}
    ports: ["5003:8080"]
    depends_on:
      ordering-postgres:
        condition: service_healthy

  payments-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
      POSTGRES_DB: payments
    ports: ["5436:5432"]
    volumes: [payments-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20

  payments-api:
    build:
      context: .
      dockerfile: src/Services/Payments/OrderFlow.Payments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PaymentsDatabase: Host=payments-postgres;Database=payments;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}
    ports: ["5004:8080"]
    depends_on:
      payments-postgres:
        condition: service_healthy

  notifications-postgres:
    image: postgres:18-alpine
