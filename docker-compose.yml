name: orderflow

services:
  catalog-postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
        POSTGRES_USER: ${POSTGRES_USER:-orderflow}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}

    healthcheck:
        test:
            - CMD-SHELL
            - pg_isready -U ${POSTGRES_USER:-orderflow}
        interval: 5s
        timeout: 3s
        retries: 20

    networks:
        - orderflow


x-api: &api
    restart: unless-stopped

    environment: &api-environment
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: http://+:8080

        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
        OTEL_EXPORTER_OTLP_PROTOCOL: grpc

    networks:
        - orderflow

    depends_on:
        otel-collector:
            condition: service_started


services:

    # ============================================================
    # POSTGRESQL
    # ============================================================

    catalog-db:
        <<: *postgres

        environment:
            POSTGRES_USER: ${POSTGRES_USER:-orderflow}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
            POSTGRES_DB: catalog

        volumes:
            - catalog-data:/var/lib/postgresql


    inventory-db:
        <<: *postgres

        environment:
            POSTGRES_USER: ${POSTGRES_USER:-orderflow}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
            POSTGRES_DB: inventory

        volumes:
            - inventory-data:/var/lib/postgresql


    ordering-db:
        <<: *postgres

        environment:
            POSTGRES_USER: ${POSTGRES_USER:-orderflow}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
            POSTGRES_DB: ordering

        volumes:
            - ordering-data:/var/lib/postgresql


    payments-db:
        <<: *postgres

        environment:
            POSTGRES_USER: ${POSTGRES_USER:-orderflow}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
            POSTGRES_DB: payments

        volumes:
            - payments-data:/var/lib/postgresql


    notifications-db:
        <<: *postgres

        environment:
            POSTGRES_USER: ${POSTGRES_USER:-orderflow}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
            POSTGRES_DB: notifications

        volumes:
            - notifications-data:/var/lib/postgresql


    # ============================================================
    # KAFKA
    # ============================================================

    kafka:
        image: apache/kafka:4.1.0
        hostname: kafka
        restart: unless-stopped

        ports:
            - "9092:9092"

        environment:

            # ----------------------------------------------------
            # KRaft
            # ----------------------------------------------------

            KAFKA_NODE_ID: 1

            KAFKA_PROCESS_ROLES: broker,controller

            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

            CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw


            # ----------------------------------------------------
            # Listeners
            # ----------------------------------------------------

            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

            KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092

            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092

            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL


            # ----------------------------------------------------
            # Single broker development configuration
            # ----------------------------------------------------

            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0


            # ----------------------------------------------------
            # Topics
            # ----------------------------------------------------

            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"


            # ----------------------------------------------------
            # Storage
            # ----------------------------------------------------

            KAFKA_LOG_DIRS: /var/lib/kafka/data

        volumes:
            - kafka-data:/var/lib/kafka/data

        networks:
            - orderflow


    # ============================================================
    # OPENTELEMETRY
    # ============================================================

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.136.0

        command:
            - "--config=/etc/otelcol/config.yaml"

        volumes:
            - "./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"

        ports:
            - "4317:4317"
            - "4318:4318"

        networks:
            - orderflow


    # ============================================================
    # CATALOG API
    # ============================================================

    catalog-api:
        <<: *api

        build:
            context: .
            dockerfile: src/Services/Catalog/OrderFlow.Catalog.Api/Dockerfile

        ports:
            - "5001:8080"

        environment:
            <<: *api-environment

            ConnectionStrings__CatalogDatabase: Host=catalog-db;Database=catalog;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}

        depends_on:
            catalog-db:
                condition: service_healthy

            otel-collector:
                condition: service_started


    # ============================================================
    # INVENTORY API
    # ============================================================

    inventory-api:
        <<: *api

        build:
            context: .
            dockerfile: src/Services/Inventory/OrderFlow.Inventory.Api/Dockerfile

        ports:
            - "5002:8080"

        environment:
            <<: *api-environment

            ConnectionStrings__InventoryDatabase: Host=inventory-db;Database=inventory;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}

            Kafka__BootstrapServers: kafka:19092

        depends_on:
            inventory-db:
                condition: service_healthy

            kafka:
                condition: service_started

            otel-collector:
                condition: service_started


    # ============================================================
    # ORDERING API
    # ============================================================

    ordering-api:
        <<: *api

        build:
            context: .
            dockerfile: src/Services/Ordering/OrderFlow.Ordering.Api/Dockerfile

        ports:
            - "5003:8080"

        environment:
            <<: *api-environment

            ConnectionStrings__OrderingDatabase: Host=ordering-db;Database=ordering;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}

            Kafka__BootstrapServers: kafka:19092

        depends_on:
            ordering-db:
                condition: service_healthy

            kafka:
                condition: service_started

            otel-collector:
                condition: service_started


    # ============================================================
    # PAYMENTS API
    # ============================================================

    payments-api:
        <<: *api

        build:
            context: .
            dockerfile: src/Services/Payments/OrderFlow.Payments.Api/Dockerfile

        ports:
            - "5004:8080"

        environment:
            <<: *api-environment

            ConnectionStrings__PaymentsDatabase: Host=payments-db;Database=payments;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}

            DevelopmentPaymentGateway__Succeed: ${PAYMENT_GATEWAY_SUCCEED:-true}

            Kafka__BootstrapServers: kafka:19092

        depends_on:
            payments-db:
                condition: service_healthy

            kafka:
                condition: service_started

            otel-collector:
                condition: service_started


    # ============================================================
    # NOTIFICATIONS API
    # ============================================================

    notifications-api:
        <<: *api

        build:
            context: .
            dockerfile: src/Services/Notifications/OrderFlow.Notifications.Api/Dockerfile

        ports:
            - "5005:8080"

        environment:
            <<: *api-environment

            ConnectionStrings__NotificationsDatabase: Host=notifications-db;Database=notifications;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}

            Kafka__BootstrapServers: kafka:19092

        depends_on:
            notifications-db:
                condition: service_healthy

            kafka:
                condition: service_started

            otel-collector:
                condition: service_started


# ============================================================
# NETWORK
# ============================================================

  notifications-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderflow_dev_only}
      POSTGRES_DB: notifications
    ports: ["5437:5432"]
    volumes: [notifications-postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow} -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  notifications-api:
    build:
      context: .
      dockerfile: src/Services/Notifications/OrderFlow.Notifications.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__NotificationsDatabase: Host=notifications-postgres;Database=notifications;Username=${POSTGRES_USER:-orderflow};Password=${POSTGRES_PASSWORD:-orderflow_dev_only}
    ports: ["5005:8080"]
    depends_on:
      notifications-postgres:
        condition: service_healthy


# ============================================================
# VOLUMES
# ============================================================

volumes:
    catalog-data:
    inventory-data:
    ordering-data:
    payments-data:
    notifications-data:
    kafka-data:
